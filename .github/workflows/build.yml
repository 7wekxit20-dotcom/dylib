name: Build iOS Dylib (Ubuntu Manual)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld perl \
                                 liblzma-dev libssl-dev libxml2-dev \
                                 uuid-dev fakeroot curl git xz-utils
                                 
      - name: Setup Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          THEOS: /home/runner/theos

      - name: Setup iOS SDK
        run: |
          curl -LO https://github.com/xybp888/iOS-SDKs/releases/download/14.5/iPhoneOS14.5.sdk.tar.xz
          tar -xf iPhoneOS14.5.sdk.tar.xz -C /home/runner/theos/sdks
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Build Tweak
        run: |
          export THEOS=/home/runner/theos
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-dylib
          path: .theos/obj/**/*.dylib
          
      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-deb
          path: packages/*.deb

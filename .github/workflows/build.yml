name: Build iOS Dylib (Linux Cross-Compile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: roothide/setup-theos@v1
        with:
          theos-branch: master

      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-dylib
          path: .theos/obj/**/*.dylib
          
      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-deb
          path: packages/*.deb

name: Build iOS Dylib (Ubuntu Docker)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/theos/theos:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Permissions
        run: git config --global --add safe.directory /__w/dylib/dylib || true

      - name: Build Tweak
        run: |
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-dylib
          path: .theos/obj/**/*.dylib
          
      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-deb
          path: packages/*.deb

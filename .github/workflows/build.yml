name: Build iOS Dylib (Manual Setup)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: brew install ldid xz

      - name: Setup Theos
        run: |
          echo "Setting up Theos manually to catch any errors..."
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        env:
          THEOS: /Users/runner/theos

      - name: Build Tweak
        run: |
          echo "Compiling iOS dylib..."
          export THEOS=/Users/runner/theos
          make package FINALPACKAGE=1
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-dylib
          path: .theos/obj/**/*.dylib
          
      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-deb
          path: packages/*.deb

name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang + cross-compile tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld llvm

      - name: Compile iOS ARM64 dylib
        run: |
          clang++ \
            -target aarch64-apple-darwin \
            -shared -fPIC -std=c++17 -O2 \
            -o banBypass.dylib ban.cpp
          echo "=== Result ===" && ls -lh banBypass.dylib

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-dylib
          path: banBypass.dylib
          if-no-files-found: error

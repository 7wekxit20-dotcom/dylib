name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM64 Apple Cross-Compiler (osxcross)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld curl git cmake make libssl-dev libxml2-dev zlib1g-dev

      - name: Compile iOS ARM64 dylib
        run: |
          echo "Compiling ban.cpp -> banBypass.dylib (iOS ARM64)"
          clang++ \
            -target arm64-apple-ios14.0 \
            -shared \
            -fPIC \
            -std=c++17 \
            -O2 \
            -isysroot /nonexistent \
            -nostdlib \
            -Wl,-dylib \
            -o banBypass.dylib \
            ban.cpp \
            -ldl || true

          # If sysroot approach fails, use simpler cross-compile without sysroot
          if [ ! -f banBypass.dylib ] || [ ! -s banBypass.dylib ]; then
            echo "Trying alternative compile method..."
            clang++ \
              -target arm64-apple-darwin \
              -shared \
              -fPIC \
              -std=c++17 \
              -O2 \
              -Wl,-dylib \
              -o banBypass.dylib \
              ban.cpp \
              -ldl
          fi
          echo "=== Result ==="
          ls -lh banBypass.dylib || echo "COMPILE FAILED"
          file banBypass.dylib || true

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: banBypass-dylib
          path: banBypass.dylib
          if-no-files-found: error
